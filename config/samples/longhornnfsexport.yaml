apiVersion: storage.k8s-darwin.dev/v1alpha1
kind: LonghornNFSExport
metadata:
  name: example
  namespace: default
spec:
  pvcRef:
    name: replace-with-longhorn-pvc
  # Use RWX only for a Longhorn share-manager PVC; it is a separate acceptance path.
  mode: RWO
  protocol: NFSv3
  helper:
    # Docker Hub longhornio/nfs-ganesha:latest, pinned to its multi-arch manifest digest.
    nfsGaneshaImage: docker.io/longhornio/nfs-ganesha@sha256:e633d9f2aa0281c6def298651a1b83a5dbb19f03f435f049aa1a757a53aa882b
  handoff:
    enabled: true
    nativePodSelector:
      storage.k8s-darwin.dev/native: "true"
