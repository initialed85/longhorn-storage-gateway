apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-nfs-gateway
  labels:
    app.kubernetes.io/name: longhorn-nfs-gateway
    storage.k8s-darwin.dev/poc: longhorn-nfs-gateway
    storage.k8s-darwin.dev/mode: rwo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-nfs-gateway
      storage.k8s-darwin.dev/mode: rwo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-nfs-gateway
        storage.k8s-darwin.dev/poc: longhorn-nfs-gateway
        storage.k8s-darwin.dev/mode: rwo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nfs-ganesha
          image: docker.io/longhornio/nfs-ganesha@sha256:e633d9f2aa0281c6def298651a1b83a5dbb19f03f435f049aa1a757a53aa882b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["ln -sf /proc/mounts /etc/mtab && mkdir -p /run/rpcbind && rpcbind -f -w & exec ganesha.nfsd -F -L STDOUT -f /etc/ganesha-config/ganesha.conf"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: mountd
              containerPort: 20048
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: nfs
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: export
              mountPath: /export
            - name: ganesha-config
              mountPath: /etc/ganesha-config
              readOnly: true
            - name: ganesha-run
              mountPath: /var/run/ganesha
            - name: ganesha-state
              mountPath: /var/lib/nfs
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: REPLACE_WITH_LONGHORN_RWO_PVC_NAME
        - name: ganesha-config
          configMap:
            name: longhorn-nfs-ganesha
        - name: ganesha-run
          emptyDir: {}
        - name: ganesha-state
          emptyDir: {}
