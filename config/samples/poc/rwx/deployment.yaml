apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-nfs-gateway
  labels:
    app.kubernetes.io/name: longhorn-nfs-gateway
    storage.k8s-darwin.dev/poc: longhorn-nfs-gateway
    storage.k8s-darwin.dev/mode: rwx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-nfs-gateway
      storage.k8s-darwin.dev/mode: rwx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-nfs-gateway
        storage.k8s-darwin.dev/poc: longhorn-nfs-gateway
        storage.k8s-darwin.dev/mode: rwx
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nfs-ganesha
          image: REPLACE_WITH_PINNED_NFS_GANESHA_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["ganesha.nfsd"]
          args: ["-F", "-L", "STDOUT", "-f", "/etc/ganesha/ganesha.conf"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: mountd
              containerPort: 20048
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: nfs
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: export
              mountPath: /export
            - name: ganesha-config
              mountPath: /etc/ganesha/ganesha.conf
              subPath: ganesha.conf
              readOnly: true
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: REPLACE_WITH_LONGHORN_RWX_PVC_NAME
        - name: ganesha-config
          configMap:
            name: longhorn-nfs-ganesha
