apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-nfs-gateway-controller
  namespace: longhorn-nfs-gateway-system
  labels:
    app.kubernetes.io/name: longhorn-nfs-gateway
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-nfs-gateway
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-nfs-gateway
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: longhorn-nfs-gateway-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Pin this image to a release digest before production deployment.
          image: ghcr.io/initialed85/longhorn-nfs-gateway:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
